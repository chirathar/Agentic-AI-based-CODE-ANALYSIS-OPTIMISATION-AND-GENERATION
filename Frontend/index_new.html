<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI Code Analysis & Optimization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🧠 Agentic AI Code Analysis & Optimization</h1>
            <p>Analyze, Optimize, and Learn with AI-Powered Code Intelligence</p>
        </header>

        <main class="main-content">
            <div class="controls-section">
                <div class="language-selector">
                    <label for="language-select">Select Language:</label>
                    <select id="language-select">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="ruby">Ruby</option>
                        <option value="php">PHP</option>
                    </select>
                </div>

                <div class="button-group">
                    <button id="analyze-btn" class="btn btn-primary">Analyze Code</button>
                    <button id="optimize-btn" class="btn btn-secondary" disabled>Get Optimization</button>
                    <button id="explain-btn" class="btn btn-tertiary" disabled>Explain Code</button>
                    <button id="refactor-btn" class="btn btn-secondary" disabled>Refactoring Tips</button>
                    <button id="clear-btn" class="btn btn-danger">Clear</button>
                </div>
            </div>

            <div class="editor-container">
                <div class="editor-panel">
                    <h3>Code Input</h3>
                    <textarea id="code-input" placeholder="Paste your code here..."></textarea>
                </div>

                <div class="results-panel">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="metrics">Metrics</button>
                        <button class="tab-btn" data-tab="optimization">Optimization</button>
                        <button class="tab-btn" data-tab="explanation">Explanation</button>
                        <button class="tab-btn" data-tab="refactoring">Refactoring</button>
                    </div>

                    <div class="tab-content">
                        <div id="metrics" class="tab-pane active">
                            <div class="metrics-grid">
                                <div class="metric-card">
                                    <span class="metric-label">Lines of Code</span>
                                    <span class="metric-value" id="loc">-</span>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-label">Logical Lines</span>
                                    <span class="metric-value" id="lloc">-</span>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-label">Complexity</span>
                                    <span class="metric-value" id="complexity">-</span>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-label">Halstead Volume</span>
                                    <span class="metric-value" id="volume">-</span>
                                </div>
                            </div>
                            <div id="metrics-details" class="details-section"></div>
                        </div>

                        <div id="optimization" class="tab-pane">
                            <div id="optimization-content" class="content-section"></div>
                        </div>

                        <div id="explanation" class="tab-pane">
                            <div id="explanation-content" class="content-section"></div>
                        </div>

                        <div id="refactoring" class="tab-pane">
                            <div id="refactoring-content" class="content-section"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="progress-section" id="progress-section" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p id="progress-text">Processing...</p>
            </div>
        </main>

        <footer class="footer">
            <p>Powered by Advanced AI Code Analysis Engine | Built with Flask & Agentic AI</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
