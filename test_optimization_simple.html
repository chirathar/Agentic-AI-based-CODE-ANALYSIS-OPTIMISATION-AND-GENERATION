<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Optimization Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .input-area, .output-area {
            background: #2a2a2a;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            font-family: monospace;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .output-panel {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            min-height: 100px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .info { background: #2d4a5a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Optimization Test</h1>
        
        <div class="input-area">
            <h3>Input Code:</h3>
            <textarea id="codeInput" placeholder="Enter your Python code here...">def calculate_sum(numbers):
    total = 0
    for i in range(len(numbers)):
        total += numbers[i]
    return total</textarea>
            <br><br>
            <button onclick="optimizeCode()">Optimize Code</button>
        </div>
        
        <div class="output-area">
            <h3>Optimized Code:</h3>
            <div id="optimizedOutput" class="output-panel">Optimized code will appear here...</div>
        </div>
        
        <div id="status" class="status info">Ready to optimize code</div>
    </div>

    <script>
        async function optimizeCode() {
            const codeInput = document.getElementById('codeInput');
            const optimizedOutput = document.getElementById('optimizedOutput');
            const status = document.getElementById('status');
            
            if (!codeInput.value.trim()) {
                showStatus('Please enter some code to optimize', 'error');
                return;
            }
            
            showStatus('Optimizing code...', 'info');
            optimizedOutput.textContent = 'Optimizing...';
            
            try {
                const response = await fetch('/api/optimize/optimized-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        code: codeInput.value,
                        metrics: { complexity: 5, lines_of_code: 5 },
                        language: 'python'
                    })
                });
                
                if (response.ok) {
                    const optimizedText = await parseStreamingResponse(response);
                    
                    if (optimizedText && optimizedText.trim()) {
                        optimizedOutput.textContent = optimizedText;
                        showStatus('Code optimized successfully!', 'success');
                        console.log('Optimization successful:', optimizedText);
                    } else {
                        optimizedOutput.textContent = 'No optimizations needed';
                        showStatus('No optimizations needed', 'info');
                    }
                } else {
                    throw new Error('Optimization failed');
                }
            } catch (error) {
                console.error('Error:', error);
                optimizedOutput.textContent = 'Error: ' + error.message;
                showStatus('Optimization failed: ' + error.message, 'error');
            }
        }
        
        async function parseStreamingResponse(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let result = '';
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.status === 'complete' && data.content) {
                                result = data.content;
                                break;
                            }
                        } catch (e) {
                            // Ignore parsing errors
                        }
                    }
                }
            }
            
            return result;
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }
        
        // Test on page load
        window.onload = function() {
            console.log('Simple optimization test page loaded');
            showStatus('Ready to optimize code', 'info');
        };
    </script>
</body>
</html>
